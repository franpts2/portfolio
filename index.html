<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="theme-color" content="#faf8f5" />
		<meta name="color-scheme" content="light" />
		<link rel="icon" href="/logo.svg" type="image/svg+xml" />

		<!--
			Scroll handling: a refresh should open at the top of the page, not on the
			section whose anchor happens to be in the URL. Runs in <head> so the
			stale hash is dropped before the browser looks for the target element.
			Deep links opened normally still land on their section.
		-->
		<script>
			if ("scrollRestoration" in history) {
				history.scrollRestoration = "manual";
			}
			try {
				var navEntry = performance.getEntriesByType("navigation")[0];
				var isReload = navEntry
					? navEntry.type === "reload"
					: performance.navigation && performance.navigation.type === 1;
				if (isReload && location.hash) {
					history.replaceState(null, "", location.pathname + location.search);
				}
			} catch (e) {
				// Older browsers fall back to the reset in App.tsx.
			}
		</script>
		<title>Francisca Portugal · Frontend Engineer</title>

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://franciscapt.dev/" />
		<meta property="og:title" content="Francisca Portugal · Frontend Engineer" />
		<meta property="og:description" content="Frontend engineer building interfaces that are rigorous underneath and effortless on the surface." />
		<meta property="og:image" content="/og-image.png" />

		<!-- Twitter / X -->
		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:url" content="https://franciscapt.dev/" />
		<meta property="twitter:title" content="Francisca Portugal · Frontend Engineer" />
		<meta property="twitter:description" content="Frontend engineer building interfaces that are rigorous underneath and effortless on the surface." />
		<meta property="twitter:image" content="/og-image.png" />

		<!-- Additional SEO -->
		<meta name="description" content="Frontend engineer building interfaces that are rigorous underneath and effortless on the surface." />

		<!-- Critical resource hints: establish connections early -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://api.fontshare.com" crossorigin />
		<link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

		<!-- Preload critical portrait -->
		<link rel="preload" as="image" href="/images/people/francisca-portugal.png" />
		<link
			rel="preload"
			as="style"
			href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap"
		/>
		<link
			rel="preload"
			as="style"
			href="https://api.fontshare.com/v2/css?f[]=clash-display@400;500;600&display=swap"
		/>

		<!-- Load fonts asynchronously to avoid render blocking -->
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap"
			media="print"
			onload="this.media = 'all'"
		/>
		<link
			rel="stylesheet"
			href="https://api.fontshare.com/v2/css?f[]=clash-display@400;500;600&display=swap"
			media="print"
			onload="this.media = 'all'"
		/>
		<noscript>
			<link
				rel="stylesheet"
				href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap"
			/>
			<link
				rel="stylesheet"
				href="https://api.fontshare.com/v2/css?f[]=clash-display@400;500;600&display=swap"
			/>
		</noscript>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
